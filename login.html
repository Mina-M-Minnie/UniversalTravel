<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Universal Travel</title>

  <!-- fonts from our style guide -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Prompt:wght@400;600&family=Roboto+Condensed:wght@400;700&family=Shrikhand&display=swap" rel="stylesheet">

  <!-- shared style + saved settings (text size, contrast, colour-blind mode) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/preferences.js"></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <main id="main" class="login-page">
    <form id="loginForm" class="login-card" novalidate>
      <img class="login-logo" src="images/logo-beige.png" alt="Universal Travel">
      <h1>Sign in</h1>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p id="error" class="error" role="alert" hidden></p>

      <button id="submit" type="submit">Sign in</button>
    </form>
  </main>

  <footer class="site-footer">
    <img class="footer-logo" src="images/logo-red.png" alt="">
    <p class="small">Universal Travel</p>
  </footer>
</body>
</html>
